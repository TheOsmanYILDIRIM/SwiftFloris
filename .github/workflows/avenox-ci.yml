name: Avenox CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avenox-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PREVIEW_PLATFORM: "platforms;android-37.0"
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/SysAdminDoc/SwiftFloris.git
          git fetch --no-tags upstream master

      - name: Ensure Android 17 preview SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi

          # Android 17 / API 37 is still distributed through the preview
          # repository and the platform package is named android-37.0.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3             "$ANDROID_PREVIEW_PLATFORM"             "build-tools;$ANDROID_BUILD_TOOLS"

          # AGP's integer compileSdk=37 resolves $ANDROID_HOME/platforms/android-37.
          # Preview sdkmanager currently installs android-37.0, so expose the
          # same SDK payload at the integer API path without copying it.
          PREVIEW_DIR="$ANDROID_HOME/platforms/android-37.0"
          COMPILE_DIR="$ANDROID_HOME/platforms/android-$ANDROID_COMPILE_SDK"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Android 17 preview platform was not installed at $PREVIEW_DIR" >&2
            exit 1
          fi
          if [ ! -e "$COMPILE_DIR" ]; then
            ln -s "$PREVIEW_DIR" "$COMPILE_DIR"
          fi
          test -f "$COMPILE_DIR/android.jar"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"

      - name: Verify thin Avenox overlay
        run: python3 scripts/check-avenox-overlay.py --upstream-ref upstream/master

      - name: Raise Linux file watcher capacity
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_queued_events=65536

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon             :app:verifyNoInternetPermission             :app:testDebugUnitTest             :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: swiftfloris-avenox-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
