name: Avenox CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avenox-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/SysAdminDoc/SwiftFloris.git
          git fetch --no-tags upstream master

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify thin Avenox overlay
        run: python3 scripts/check-avenox-overlay.py --upstream-ref upstream/master

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:verifyNoInternetPermission \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: swiftfloris-avenox-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
