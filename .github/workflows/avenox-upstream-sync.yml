name: Avenox Upstream Sync

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avenox-upstream-sync
  cancel-in-progress: false

env:
  ANDROID_PREVIEW_PLATFORM: "platforms;android-37.0"
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/SysAdminDoc/SwiftFloris.git
          git fetch upstream master --tags
          UPSTREAM_SHA="$(git rev-parse upstream/master)"
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream ${UPSTREAM_SHA:0:12}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream candidate
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Avenox Upstream Bot"
          git config user.email "avenox-upstream-bot@users.noreply.github.com"
          SHORT_SHA="$(git rev-parse --short upstream/master)"
          if ! git merge --no-ff upstream/master -m "chore(sync): SwiftFloris upstream ${SHORT_SHA} [skip ci]"; then
            {
              echo "## Upstream sync conflict"
              echo
              echo "Upstream: `${{ steps.upstream.outputs.sha }}`"
              echo
              echo "Conflicting paths:"
              git diff --name-only --diff-filter=U | sed 's/^/- `/' | sed 's/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

      - name: Set up JDK 21
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Android 17 preview SDK
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3             "$ANDROID_PREVIEW_PLATFORM"             "build-tools;$ANDROID_BUILD_TOOLS"

          PREVIEW_DIR="$ANDROID_HOME/platforms/android-37.0"
          COMPILE_DIR="$ANDROID_HOME/platforms/android-$ANDROID_COMPILE_SDK"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Android 17 preview platform was not installed at $PREVIEW_DIR" >&2
            exit 1
          fi
          if [ ! -e "$COMPILE_DIR" ]; then
            ln -s "$PREVIEW_DIR" "$COMPILE_DIR"
          fi
          test -f "$COMPILE_DIR/android.jar"
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"

      - name: Verify thin Avenox overlay
        if: steps.upstream.outputs.changed == 'true'
        run: python3 scripts/check-avenox-overlay.py --upstream-ref upstream/master

      - name: Raise Linux file watcher capacity
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_queued_events=65536

      - name: Test upstream candidate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon             :app:verifyNoInternetPermission             :app:testDebugUnitTest             :app:assembleDebug

      - name: Push verified sync
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master
          echo "Verified upstream ${{ steps.upstream.outputs.sha }} merged into fork master." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified debug APK
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swiftfloris-avenox-upstream-${{ steps.upstream.outputs.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
